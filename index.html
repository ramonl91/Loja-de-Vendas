<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha Loja</title>
<style>
:root{--bg:#f5f0f8;--card:#fff;--tx:#2a1a33;--mut:#7a6a86;--pri:#5b2a86;--pri2:#43206a;--bd:#e4d9ec;--warn:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#170f1e;--card:#221730;--tx:#f3ecf8;--mut:#b3a3c2;--pri:#9b5de5;--pri2:#8445cc;--bd:#35254a;--warn:#fb923c}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.4}
header{background:linear-gradient(135deg,#3b1760,#7b3fb0);color:#fff;padding:18px 16px;text-align:center}
header h1{margin:0;font-size:1.4rem}
.lg{display:none;width:68px;height:68px;border-radius:50%;object-fit:contain;background:#fff;border:3px solid rgba(255,255,255,.65);margin:0 auto 8px}
nav{display:flex;gap:6px;padding:10px;max-width:900px;margin:auto}
nav button{flex:1;padding:12px 6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font-size:.85rem;cursor:pointer}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{max-width:900px;margin:auto;padding:10px 12px 90px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:1.15rem}
label{display:block;font-size:.85rem;color:var(--mut);margin:8px 0 3px}
input,textarea,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.btn{padding:11px 16px;border:0;border-radius:10px;background:var(--pri);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6}.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.p{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.p img,.ph{width:100%;aspect-ratio:1;object-fit:cover;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:2.5rem}
.p .i{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.p small{color:var(--mut)}.price{color:var(--pri);font-weight:700;font-size:1.05rem}.p .i .btn{margin-top:auto;padding:9px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.stat span{color:var(--mut);font-size:.8rem}.stat b{display:block;font-size:1.25rem;color:var(--pri)}
.it{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--bd);padding:8px 0}
.it img,.it .ph{width:54px;height:54px;border-radius:10px;object-fit:cover;font-size:1.4rem;flex:none}
.it .t{flex:1;min-width:0}.it .t small{display:block;color:var(--mut)}
.low{color:var(--warn);font-weight:600}
.cart{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:876px;margin:auto}
.cart .btn{width:100%;padding:15px;font-size:1rem;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.tip{background:var(--bg);border:1px dashed var(--bd);border-radius:10px;padding:10px;font-size:.85rem;color:var(--mut);margin-top:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}
.chip{flex:none;padding:8px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.cl{border-bottom:1px solid var(--bd);padding:12px 0}.cl .m{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0;font-size:.88rem}.cl .m b{color:var(--pri)}
.cw{position:relative}.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.car::-webkit-scrollbar{display:none}
.car img{flex:none;width:100%;aspect-ratio:1;object-fit:cover;scroll-snap-align:start}
.ar{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:1.2rem;line-height:1;cursor:pointer}.ar.l{left:6px}.ar.r{right:6px}
.dt{position:absolute;bottom:6px;left:0;right:0;display:flex;justify-content:center;gap:5px}.dt i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55)}.dt i.on{background:#fff}
</style>
</head>
<body>
<header><img id="hl" class="lg" alt="Logo da loja"><h1 id="hn">Minha Loja</h1></header>
<nav id="nav" style="display:none"></nav>
<main id="app"><div class="empty">Carregando...</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
const SB_URL="https://xgarabyshogrjgafbtga.supabase.co",SB_KEY="sb_publishable_lwkCcTlfzKpQ3d-ZK-nanw_ssgbyv0V";
const db=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const slugify=t=>t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
const q=async p=>{const {data,error}=await p;if(error){alert("Algo deu errado: "+error.message);return null}return data==null?true:data};
const novo=()=>({produtos:[],categorias:[],clientes:[],vendas:[],loja:null});
let D=novo(),tab="produtos",uid=null,edit=null,ec=null,aberto=null,fotosEdit=[],rem=[],gf="",cart={},modo="entrar";
const SLUG=new URLSearchParams(location.search).get("loja");
// Depois de publicar na Vercel, coloque aqui o endereço do site entre as aspas. Exemplo: "https://minhaloja.vercel.app/"
const SITE_URL="";
const base=()=>SITE_URL||location.href.split("?")[0].split("#")[0];
const catNome=id=>(D.categorias.find(c=>c.id===id)||{}).nome||"";
const lista=p=>p.fotos&&p.fotos.length?p.fotos:(p.foto_url?[p.foto_url]:[]);
const img=p=>{const u=lista(p)[0];return u?`<img src="${esc(u)}" alt="${esc(p.nome)}" loading="lazy">`:`<div class="ph">📷</div>`};
function galeria(p){
  const u=lista(p);
  if(u.length<2)return img(p);
  return `<div class="cw"><div class="car" onscroll="dots(this)">${u.map(x=>`<img src="${esc(x)}" alt="${esc(p.nome)}" loading="lazy">`).join("")}</div><button class="ar l" onclick="rolar(this,-1)" aria-label="Anterior">‹</button><button class="ar r" onclick="rolar(this,1)" aria-label="Próxima">›</button><div class="dt">${u.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div></div>`;
}
function dots(el){const i=Math.round(el.scrollLeft/el.clientWidth);el.parentNode.querySelectorAll(".dt i").forEach((d,k)=>d.className=k===i?"on":"")}
function rolar(b,d){const c=b.parentNode.querySelector(".car");c.scrollBy({left:d*c.clientWidth,behavior:"smooth"})}
const prev=u=>`<img src="${u}" style="width:90px;height:90px;object-fit:cover;border-radius:10px;margin-top:8px" alt="">`;
const porNome=(a,b)=>a.nome.localeCompare(b.nome);

async function init(){
  if(SLUG){
    const {data:l}=await db.from("lojas").select("*").eq("slug",SLUG).maybeSingle();
    if(!l){$("#app").innerHTML='<div class="empty">Loja não encontrada.</div>';return}
    D.loja=l;document.title=l.nome;
    const [p,c]=await Promise.all([db.from("produtos").select("*").eq("loja_id",l.id).gt("estoque",0),db.from("categorias").select("*").eq("loja_id",l.id)]);
    D.produtos=(p.data||[]).sort(porNome);D.categorias=c.data||[];
  }else{
    const {data:{session}}=await db.auth.getSession();
    const rec=location.hash.includes("type=recovery");
    if(rec)modo="nova";else if(session){uid=session.user.id;await load()}
  }
  draw();
}
async function load(){
  const t=(n,f)=>db.from(n).select("*").eq(f,uid);
  const [l,p,c,k,v]=await Promise.all([t("lojas","id"),t("produtos","loja_id"),t("categorias","loja_id"),t("clientes","loja_id"),t("vendas","loja_id")]);
  D.loja=(l.data||[])[0]||null;
  if(!D.loja){const r=await db.from("lojas").insert({nome:"Minha Loja",slug:uid.replace(/-/g,"")}).select().single();D.loja=r.data}
  D.produtos=(p.data||[]).sort(porNome);D.categorias=(c.data||[]).sort(porNome);D.clientes=(k.data||[]).sort(porNome);
  D.vendas=(v.data||[]).sort((a,b)=>new Date(a.criado_em)-new Date(b.criado_em));
}
function draw(){
  const L=D.loja,lg=$("#hl"),nv=$("#nav");
  $("#hn").textContent=(L&&L.nome)||"Minha Loja";
  if(L&&L.logo_url){lg.src=L.logo_url;lg.style.display="block"}else lg.style.display="none";
  if(SLUG){nv.style.display="none";$("#app").innerHTML=vCat();return}
  if(!uid){nv.style.display="none";$("#app").innerHTML=vAuth();return}
  nv.style.display="flex";
  nv.innerHTML=[["produtos","📦 Produtos"],["vendas","💰 Vendas"],["clientes","👥 Clientes"],["config","⚙️ Ajustes"]].map(([k,l])=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';draw()">${l}</button>`).join("");
  $("#app").innerHTML=({produtos:vProd,vendas:vVen,clientes:vCli,config:vCfg})[tab]();
}

/* ENTRAR / CRIAR LOJA */
function pw(id,ac){return `<div style="position:relative"><input id="${id}" type="password" autocomplete="${ac}" style="padding-right:48px"><button type="button" onclick="ver('${id}',this)" aria-label="Mostrar ou ocultar senha" style="position:absolute;right:4px;top:4px;bottom:4px;width:40px;border:0;background:transparent;font-size:1.1rem;cursor:pointer">👁️</button></div>`}
function ver(id,b){const i=$("#"+id),m=i.type==="password";i.type=m?"text":"password";b.textContent=m?"🙈":"👁️"}
function vAuth(){
  const c=modo==="criar",e=modo==="esqueci",n=modo==="nova";
  const tit=c?"Criar minha loja":e?"Recuperar senha":n?"Criar nova senha":"Entrar";
  const acao=c?"criar()":e?"recuperar()":n?"novaSenha()":"entrar()";
  const lnk=(m,t)=>`<a href="#" onclick="modo='${m}';draw();return false" style="color:var(--pri)">${t}</a>`;
  return `<div id="auth" class="card" style="max-width:420px;margin:20px auto"><h2>${tit}</h2>
  ${c?`<label>Nome da loja</label><input id="an" oninput="sg()"><label>Endereço do catálogo (sem espaços)</label><input id="as" placeholder="ex: natura-maria" oninput="this.dataset.t=1">`:""}
  ${n?"":`<label>E-mail</label><input id="ae" type="email" autocomplete="email">`}
  ${e?`<div class="tip">Enviaremos um link para você criar uma nova senha.</div>`:`<label>${n?"Nova senha":"Senha"} ${c||n?"(mínimo 6 caracteres)":""}</label>${pw("ap",c||n?"new-password":"current-password")}`}
  ${c||n?`<label>Confirmar senha</label>${pw("ap2","new-password")}`:""}
  <div style="margin-top:12px"><button id="abtn" class="btn" style="width:100%" onclick="${acao}">${tit}</button></div>
  <p style="text-align:center;line-height:2">${modo==="entrar"?lnk("esqueci","Esqueci minha senha")+"<br>"+lnk("criar","Criar minha loja"):n?"":lnk("entrar","Voltar para entrar")}</p></div>`;
}
function sg(){const s=$("#as");if(!s.dataset.t)s.value=slugify($("#an").value)}
async function entrar(){
  const {data,error}=await db.auth.signInWithPassword({email:$("#ae").value.trim(),password:$("#ap").value});
  if(error){alert(/confirm/i.test(error.message)?"Seu e-mail ainda não foi confirmado. Abra o link que enviamos para o seu e-mail.":"E-mail ou senha incorretos. Use o olhinho 👁️ para conferir a senha digitada.");return}
  uid=data.user.id;await load();tab="produtos";draw();
}
async function criar(){
  const nome=$("#an").value.trim(),slug=slugify($("#as").value),email=$("#ae").value.trim(),senha=$("#ap").value;
  if(!nome||!slug||!email||senha.length<6){alert("Preencha todos os campos. A senha precisa ter 6 caracteres ou mais.");return}
  if(senha!==$("#ap2").value){alert("As senhas digitadas não são iguais.");return}
  const {data:ex}=await db.from("lojas").select("id").eq("slug",slug).maybeSingle();
  if(ex){alert("Esse endereço já está em uso. Escolha outro.");return}
  const {data,error}=await db.auth.signUp({email,password:senha,options:{data:{nome,slug}}});
  if(error){alert("Não foi possível criar a conta: "+error.message);return}
  if(!data.session){alert("Conta criada! Confirme o link enviado ao seu e-mail e depois entre.");modo="entrar";draw();return}
  uid=data.user.id;await load();tab="produtos";draw();
}
async function recuperar(){
  const email=$("#ae").value.trim();if(!email){alert("Digite o seu e-mail.");return}
  const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:base()});
  if(error){alert("Não foi possível enviar: "+error.message);return}
  alert("Se esse e-mail estiver cadastrado, você receberá um link para criar uma nova senha. Olhe também a caixa de spam.");modo="entrar";draw();
}
async function novaSenha(){
  const a=$("#ap").value;
  if(a.length<6){alert("A senha precisa ter 6 caracteres ou mais.");return}
  if(a!==$("#ap2").value){alert("As senhas digitadas não são iguais.");return}
  const {data,error}=await db.auth.updateUser({password:a});
  if(error){alert("Não foi possível alterar a senha: "+error.message);return}
  history.replaceState(null,"",base());uid=data.user.id;await load();tab="produtos";draw();alert("Senha alterada com sucesso!");
}
async function sair(){if(!confirm("Sair da conta?"))return;await db.auth.signOut();uid=null;D=novo();modo="entrar";draw()}

/* CATÁLOGO DO CLIENTE */
function vCat(){
  const ds=D.produtos.filter(p=>!gf||p.categoria_id===gf);
  const n=Object.keys(cart).reduce((a,k)=>a+cart[k],0);
  const ids=[...new Set(D.produtos.map(p=>p.categoria_id).filter(Boolean))];
  const b=(i,l)=>`<button class="chip ${gf===i?"on":""}" data-g="${i}" onclick="gf=this.dataset.g;draw()">${esc(l)}</button>`;
  let h=ids.length?`<div class="chips">${b("","Todos")}${ids.map(i=>b(i,catNome(i))).join("")}</div>`:"";
  h+=ds.length?`<div class="grid">${ds.map(p=>`<div class="p">${galeria(p)}<div class="i"><b>${esc(p.nome)}</b><small>${esc(p.descricao)}</small><span class="price">${money(p.preco)}</span><small>${p.estoque} em estoque</small><button class="btn" onclick="add('${p.id}')">Adicionar</button></div></div>`).join("")}</div>`:`<div class="empty">Nenhum produto disponível no momento.</div>`;
  if(n)h+=`<div class="cart"><button class="btn" onclick="enviar()">Enviar pedido no WhatsApp (${n} ${n>1?"itens":"item"})</button></div>`;
  return h;
}
function add(id){const p=D.produtos.find(x=>x.id===id);if((cart[id]||0)<p.estoque)cart[id]=(cart[id]||0)+1;draw()}
function enviar(){
  const num=(D.loja.whatsapp||"").replace(/\D/g,"");
  if(!num){alert("O lojista ainda não configurou o WhatsApp.");return}
  let tot=0;const l=Object.keys(cart).map(id=>{const p=D.produtos.find(x=>x.id===id),s=p.preco*cart[id];tot+=s;return "• "+cart[id]+"x "+p.nome+" – "+money(s)});
  window.open("https://wa.me/"+(num.length<=11?"55"+num:num)+"?text="+encodeURIComponent("Olá! Gostaria de fazer este pedido:\n"+l.join("\n")+"\nTotal: "+money(tot)),"_blank");
  cart={};draw();
}

/* PRODUTOS */
function vProd(){
  const e=edit?D.produtos.find(p=>p.id===edit):null;
  return `<div class="card"><h2>${e?"Editando: "+esc(e.nome):"Novo produto"}</h2>
  <label>Fotos do produto (até 3)</label><div class="row"><button class="btn" onclick="tirarFoto()">📸 Tirar foto agora</button><button class="btn sec" onclick="if(fotosEdit.length>=3)alert('Máximo de 3 fotos. Exclua uma para adicionar outra.');else $('#gal').click()">🖼️ Escolher da galeria</button></div>
  <input id="cam" type="file" accept="image/*" capture="environment" hidden onchange="lerFoto(this)"><input id="gal" type="file" accept="image/*" hidden onchange="lerFoto(this)">
  <div id="fotos">${fotosHTML()}</div>
  <label>Nome</label><input id="fn" value="${esc(e&&e.nome)}">
  <label>Grupo / categoria (ex.: Natura, Boticário)</label><input id="fg" list="gl" placeholder="Escolha um grupo ou digite um novo" value="${esc(e&&catNome(e.categoria_id))}"><datalist id="gl">${D.categorias.map(c=>`<option value="${esc(c.nome)}">`).join("")}</datalist>
  <div class="row"><div><label>Preço (R$)</label><input id="fp" type="number" step="0.01" min="0" value="${e?e.preco:""}"></div><div><label>Estoque</label><input id="fe" type="number" min="0" value="${e?e.estoque:""}"></div></div>
  <label>Descrição</label><textarea id="fd" rows="3">${esc(e&&e.descricao)}</textarea>
  <div class="row" style="margin-top:12px"><button id="sv" class="btn" onclick="salvarP()">${e?"Salvar alterações":"Adicionar produto"}</button>${e?`<button class="btn sec" onclick="edit=null;fotosEdit=[];rem=[];draw()">Cancelar</button>`:""}</div></div>
  <div class="card"><h2>Meus produtos (${D.produtos.length})</h2>${D.produtos.length?D.produtos.map(p=>`<div class="it">${img(p)}<div class="t"><b>${esc(p.nome)}</b><small>${catNome(p.categoria_id)?esc(catNome(p.categoria_id))+" · ":""}${money(p.preco)} · <span class="${p.estoque<=2?"low":""}">${p.estoque} em estoque</span></small></div><button class="btn sec" onclick="iniEdit('${p.id}')">Editar</button><button class="btn sec" onclick="delP('${p.id}')">🗑️</button></div>`).join(""):`<div class="empty">Nenhum produto ainda. Adicione o primeiro acima.</div>`}</div>`;
}
function reduzir(f,max,tipo,cb){
  const r=new FileReader();
  r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(cb,tipo,.75)};i.src=r.result};
  r.readAsDataURL(f);
}
function fotosHTML(){
  const n=fotosEdit.length;
  return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">${fotosEdit.map((f,i)=>`<div style="position:relative;width:92px"><img src="${esc(f.prev)}" style="width:92px;height:92px;object-fit:cover;border-radius:10px;display:block" alt=""><button class="btn" type="button" style="position:absolute;top:3px;right:3px;padding:2px 8px;background:var(--warn)" onclick="rmFoto(${i})" aria-label="Excluir foto">✕</button>${i===0?`<small style="display:block;text-align:center;color:var(--pri)">Capa</small>`:`<button class="btn sec" type="button" style="width:100%;padding:3px;font-size:.72rem;margin-top:2px" onclick="capa(${i})">Tornar capa</button>`}</div>`).join("")}</div><small style="color:var(--mut)">${n}/3 fotos</small>`;
}
const attF=()=>{$("#fotos").innerHTML=fotosHTML()};
function iniEdit(id){const p=D.produtos.find(x=>x.id===id);edit=id;rem=[];fotosEdit=lista(p).map(u=>({url:u,prev:u}));draw();scrollTo(0,0)}
function rmFoto(i){if(!confirm("Excluir esta foto?"))return;const f=fotosEdit[i];if(f.url)rem.push(f.url);fotosEdit.splice(i,1);attF()}
function capa(i){fotosEdit.unshift(fotosEdit.splice(i,1)[0]);attF()}
const pathDe=u=>{const k="/fotos/",i=(u||"").indexOf(k);if(i<0)return null;const t=decodeURIComponent(u.slice(i+k.length));return t.startsWith(uid+"/")?t:null};
const limpar=us=>{const l=us.map(pathDe).filter(Boolean);if(l.length)db.storage.from("fotos").remove(l)};
async function addFoto(f){
  if(fotosEdit.length>=3){alert("Máximo de 3 fotos. Exclua uma para adicionar outra.");return}
  const b=await cortar(f,false);if(!b)return;
  fotosEdit.push({blob:b,prev:URL.createObjectURL(b)});attF();
}
function lerFoto(el){const f=el.files[0];el.value="";if(f)addFoto(f)}
async function tirarFoto(){
  if(fotosEdit.length>=3){alert("Máximo de 3 fotos. Exclua uma para adicionar outra.");return}
  const C=window.Capacitor,cam=C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.Camera;
  if(!cam){$("#cam").click();return}

/* Limpa o fundo: parte das bordas da foto e avança só por áreas lisas, parando onde há contorno forte */
function limparFundo(c,sens,taps){
  const W=c.width,H=c.height,N=W*H,cx=c.getContext("2d"),im=cx.getImageData(0,0,W,H),d=im.data;
  const b=new Float32Array(N*3),L=new Float32Array(N),G=new Float32Array(N);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    let r=0,g=0,bl=0,n=0;
    for(let j=-1;j<=1;j++){const yy=y+j;if(yy<0||yy>=H)continue;for(let i=-1;i<=1;i++){const xx=x+i;if(xx<0||xx>=W)continue;const k=(yy*W+xx)*4;r+=d[k];g+=d[k+1];bl+=d[k+2];n++}}
    const p=y*W+x;b[p*3]=r/n;b[p*3+1]=g/n;b[p*3+2]=bl/n;L[p]=.299*b[p*3]+.587*b[p*3+1]+.114*b[p*3+2];
  }
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const p=y*W+x;
    const gx=L[p-W+1]+2*L[p+1]+L[p+W+1]-L[p-W-1]-2*L[p-1]-L[p+W-1];
    const gy=L[p+W-1]+2*L[p+W]+L[p+W+1]-L[p-W-1]-2*L[p-W]-L[p-W+1];
    G[p]=Math.sqrt(gx*gx+gy*gy)}
  const Te=8+sens*.9,Ts=8+sens*.3,Tg=40+sens;
  const dist=(p,q)=>{const a=b[p*3]-b[q*3],e=b[p*3+1]-b[q*3+1],f=b[p*3+2]-b[q*3+2];return Math.sqrt(a*a+e*e+f*f)};
  const dref=(p,R)=>{const a=b[p*3]-R[0],e=b[p*3+1]-R[1],f=b[p*3+2]-R[2];return Math.sqrt(a*a+e*e+f*f)};
  const rw=Math.max(2,Math.round(Math.min(W,H)*.02)),borda=[],hist=new Map();
  const bin=p=>((b[p*3]>>4)<<8)|((b[p*3+1]>>4)<<4)|(b[p*3+2]>>4);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(x<rw||y<rw||x>=W-rw||y>=H-rw)borda.push(y*W+x);
  for(const p of borda){const k=bin(p);hist.set(k,(hist.get(k)||0)+1)}
  let best=-1,bc=0;for(const [k,v] of hist)if(v>bc){bc=v;best=k}
  const R=[0,0,0];let nb=0;
  for(const p of borda)if(bin(p)===best){R[0]+=b[p*3];R[1]+=b[p*3+1];R[2]+=b[p*3+2];nb++}
  R[0]/=nb;R[1]/=nb;R[2]/=nb;
  const bg=new Uint8Array(N),st=new Int32Array(N);let sp=0;
  const grow=ok=>{while(sp){const p=st[--sp],x=p%W,y=(p-x)/W;
    if(x>0)t(p-1,p,ok);if(x<W-1)t(p+1,p,ok);if(y>0)t(p-W,p,ok);if(y<H-1)t(p+W,p,ok)}};
  const t=(q,p,ok)=>{if(!bg[q]&&ok(q,p)){bg[q]=1;st[sp++]=q}};
  for(const p of borda)if(!bg[p]&&G[p]<Te&&dref(p,R)<Tg){bg[p]=1;st[sp++]=p}
  grow((q,p)=>G[q]<Te&&dist(q,p)<Ts&&dref(q,R)<Tg*1.5);
  /* remove manchas soltas que sobraram fora do produto */
  const lab=new Int32Array(N),sizes=[0];let nl=0;
  for(let s0=0;s0<N;s0++){
    if(bg[s0]||lab[s0])continue;
    nl++;let cnt=0;sp=0;st[sp++]=s0;lab[s0]=nl;
    while(sp){const p=st[--sp];cnt++;const x=p%W,y=(p-x)/W;
      if(x>0&&!bg[p-1]&&!lab[p-1]){lab[p-1]=nl;st[sp++]=p-1}
      if(x<W-1&&!bg[p+1]&&!lab[p+1]){lab[p+1]=nl;st[sp++]=p+1}
      if(y>0&&!bg[p-W]&&!lab[p-W]){lab[p-W]=nl;st[sp++]=p-W}
      if(y<H-1&&!bg[p+W]&&!lab[p+W]){lab[p+W]=nl;st[sp++]=p+W}}
    sizes.push(cnt);
  }
  const mx=sizes.reduce((a,v)=>Math.max(a,v),0);
  for(let p=0;p<N;p++)if(!bg[p]&&sizes[lab[p]]<Math.max(.004*N,.05*mx))bg[p]=1;
  /* toques do usuário */
  for(const [nx,ny] of taps||[]){
    const x0=Math.min(W-1,Math.max(0,Math.round(nx*W))),y0=Math.min(H-1,Math.max(0,Math.round(ny*H))),s=y0*W+x0;
    if(bg[s])continue;
    const T=[b[s*3],b[s*3+1],b[s*3+2]];bg[s]=1;sp=0;st[sp++]=s;
    grow((q,p)=>G[q]<Te*1.4&&(dref(q,T)<Tg*.6||dist(q,p)<Ts));
  }
  const edge=[];
  for(let p=0;p<N;p++){if(bg[p])continue;const x=p%W,y=(p-x)/W;if((x>0&&bg[p-1])||(x<W-1&&bg[p+1])||(y>0&&bg[p-W])||(y<H-1&&bg[p+W]))edge.push(p)}
  let tot=0;
  for(let p=0;p<N;p++)if(bg[p]){tot++;const k=p*4;d[k]=d[k+1]=d[k+2]=255;d[k+3]=255}
  for(const p of edge){const k=p*4;d[k]=(d[k]+255)>>1;d[k+1]=(d[k+1]+255)>>1;d[k+2]=(d[k+2]+255)>>1}
  cx.putImageData(im,0,0);
  return tot/N;
}
function abrirCorte(im,logo,res){
  const src=document.createElement("canvas"),k0=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight));
  src.width=Math.round(im.naturalWidth*k0);src.height=Math.round(im.naturalHeight*k0);src.getContext("2d").drawImage(im,0,0,src.width,src.height);
  let quad=true,fundo=false,sens=50,taps=[],ds,dw,dh,cr;
  const m=document.createElement("div");
  m.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto";
  document.body.appendChild(m);
  const Q=s=>m.querySelector(s),sair=v=>{m.remove();res(v)};
  const lay=()=>{ds=Math.min(330/src.width,360/src.height);dw=Math.round(src.width*ds);dh=Math.round(src.height*ds);
    const s=Math.min(dw,dh)*.85;cr=quad?{x:(dw-s)/2,y:(dh-s)/2,w:s,h:s}:{x:dw*.075,y:dh*.075,w:dw*.85,h:dh*.85}};
  lay();

  function tela1(){
    m.innerHTML=`<div class="card" style="width:100%;max-width:380px;margin:0"><h2>Cortar ${logo?"logo":"foto"}</h2>
    <canvas id="mcv" style="display:block;margin:auto;max-width:100%;touch-action:none;border-radius:8px"></canvas>
    <small style="color:var(--mut);display:block;margin-top:6px">Arraste os cantos para cortar e o meio para mover o recorte.</small>
    <div class="row" style="margin-top:10px"><button class="btn ${quad?"":"sec"}" id="mq" style="min-width:0">Quadrado</button><button class="btn ${quad?"sec":""}" id="ml" style="min-width:0">Livre</button><button class="btn sec" id="mg" style="min-width:0">↺ Girar</button></div>
    <div class="row" style="margin-top:10px"><button class="btn sec" id="mx" style="min-width:0">Cancelar</button><button class="btn" id="mn" style="min-width:0">Continuar</button></div></div>`;
    const cv=Q("#mcv");cv.width=dw;cv.height=dh;const c=cv.getContext("2d");
    const cantos=()=>[[cr.x,cr.y],[cr.x+cr.w,cr.y],[cr.x,cr.y+cr.h],[cr.x+cr.w,cr.y+cr.h]];
    const pinta=()=>{
      c.drawImage(src,0,0,dw,dh);c.fillStyle="rgba(0,0,0,.55)";
      c.fillRect(0,0,dw,cr.y);c.fillRect(0,cr.y+cr.h,dw,dh-cr.y-cr.h);c.fillRect(0,cr.y,cr.x,cr.h);c.fillRect(cr.x+cr.w,cr.y,dw-cr.x-cr.w,cr.h);
      c.strokeStyle="#fff";c.lineWidth=2;c.strokeRect(cr.x,cr.y,cr.w,cr.h);
      c.lineWidth=1;c.strokeStyle="rgba(255,255,255,.45)";c.beginPath();
      for(let i=1;i<3;i++){c.moveTo(cr.x+cr.w*i/3,cr.y);c.lineTo(cr.x+cr.w*i/3,cr.y+cr.h);c.moveTo(cr.x,cr.y+cr.h*i/3);c.lineTo(cr.x+cr.w,cr.y+cr.h*i/3)}
      c.stroke();c.fillStyle="#fff";c.strokeStyle="#222";
      for(const [x,y] of cantos()){c.fillRect(x-9,y-9,18,18);c.strokeRect(x-9,y-9,18,18)}
    };
    pinta();
    const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*dw/r.width,(e.clientY-r.top)*dh/r.height]};
    let mod=null;
    cv.onpointerdown=e=>{
      const [x,y]=pt(e),cs=cantos();let i=-1,md=36;
      cs.forEach(([a,b],k)=>{const dd=Math.hypot(a-x,b-y);if(dd<md){md=dd;i=k}});
      if(i>=0){const [ax,ay]=cs[3-i];mod={t:"r",ax,ay}}
      else if(x>cr.x&&x<cr.x+cr.w&&y>cr.y&&y<cr.y+cr.h)mod={t:"m",dx:x-cr.x,dy:y-cr.y};
      if(mod)cv.setPointerCapture(e.pointerId);
    };
    cv.onpointermove=e=>{
      if(!mod)return;let [x,y]=pt(e);
      if(mod.t==="m"){cr.x=Math.max(0,Math.min(dw-cr.w,x-mod.dx));cr.y=Math.max(0,Math.min(dh-cr.h,y-mod.dy))}
      else{
        x=Math.max(0,Math.min(dw,x));y=Math.max(0,Math.min(dh,y));
        const sx=x>=mod.ax?1:-1,sy=y>=mod.ay?1:-1;let w=Math.abs(x-mod.ax),h=Math.abs(y-mod.ay);
        if(quad){let s=Math.max(w,h);s=Math.min(s,sx>0?dw-mod.ax:mod.ax,sy>0?dh-mod.ay:mod.ay);w=h=Math.max(s,48)}
        else{w=Math.max(w,48);h=Math.max(h,48)}
        cr.x=Math.max(0,Math.min(dw-w,sx>0?mod.ax:mod.ax-w));cr.y=Math.max(0,Math.min(dh-h,sy>0?mod.ay:mod.ay-h));cr.w=w;cr.h=h;
      }
      pinta();
    };
    cv.onpointerup=cv.onpointercancel=()=>{mod=null};
    Q("#mq").onclick=()=>{quad=true;const s=Math.min(cr.w,cr.h),cx0=cr.x+cr.w/2,cy0=cr.y+cr.h/2;
      cr={x:Math.max(0,Math.min(dw-s,cx0-s/2)),y:Math.max(0,Math.min(dh-s,cy0-s/2)),w:s,h:s};tela1()};
    Q("#ml").onclick=()=>{quad=false;tela1()};
    Q("#mg").onclick=()=>{
      const t=document.createElement("canvas");t.width=src.height;t.height=src.width;const tc=t.getContext("2d");
      tc.translate(t.width/2,t.height/2);tc.rotate(Math.PI/2);tc.drawImage(src,-src.width/2,-src.height/2);
      src.width=t.width;src.height=t.height;src.getContext("2d").drawImage(t,0,0);lay();taps=[];tela1();
    };
    Q("#mx").onclick=()=>sair(null);
    Q("#mn").onclick=()=>tela2();
  }

  function tela2(){
    const sw=cr.w/ds,sh=cr.h/ds,k=Math.min(1,800/Math.max(sw,sh)),cc=document.createElement("canvas");
    cc.width=Math.max(1,Math.round(sw*k));cc.height=Math.max(1,Math.round(sh*k));
    cc.getContext("2d").drawImage(src,cr.x/ds,cr.y/ds,sw,sh,0,0,cc.width,cc.height);
    m.innerHTML=`<div class="card" style="width:100%;max-width:380px;margin:0"><h2>Fundo da ${logo?"logo":"foto"}</h2>
    <canvas id="mpv" width="330" height="330" style="display:block;margin:auto;max-width:100%;border:1px solid var(--bd);background:#fff;${logo?"border-radius:50%":"border-radius:12px"}"></canvas>
    <label style="display:flex;gap:8px;align-items:center;color:var(--tx);margin-top:10px"><input id="mf" type="checkbox" style="width:auto" ${fundo?"checked":""}> Deixar o fundo branco</label>
    <div id="mfw" ${fundo?"":"hidden"}><label>Intensidade da limpeza</label><input id="mi" type="range" min="10" max="100" value="${sens}">
    <small id="ms" style="display:block;color:var(--mut);margin-top:4px">Se sobrar fundo, toque nele na imagem. Se o produto sumir, diminua a intensidade.</small>
    <button class="btn sec" id="md" style="margin-top:8px;padding:8px 12px">Desfazer toque</button></div>
    <div class="row" style="margin-top:12px"><button class="btn sec" id="mv" style="min-width:0">← Voltar</button><button class="btn" id="mo" style="min-width:0">Usar foto</button></div></div>`;
    const mk=(P,wmax)=>{
      const k2=Math.min(1,(fundo?500:wmax)/Math.max(cc.width,cc.height)),w=document.createElement("canvas");
      w.width=Math.max(1,Math.round(cc.width*k2));w.height=Math.max(1,Math.round(cc.height*k2));
      w.getContext("2d").drawImage(cc,0,0,w.width,w.height);
      const rr=fundo?limparFundo(w,sens,taps):0,o=document.createElement("canvas");o.width=o.height=P;const oc=o.getContext("2d");
      if(!logo||fundo){oc.fillStyle="#fff";oc.fillRect(0,0,P,P)}
      const kk=P/Math.max(w.width,w.height),ww=w.width*kk,hh=w.height*kk;
      oc.drawImage(w,(P-ww)/2,(P-hh)/2,ww,hh);
      return [o,rr];
    };
    const pv=Q("#mpv"),pc=pv.getContext("2d");let tm=0;
    const pinta=()=>{const [o,rr]=mk(330,400);pc.clearRect(0,0,330,330);pc.drawImage(o,0,0);Q("#ms").style.color=rr>.96?"var(--warn)":"var(--mut)"};
    const sched=()=>{if(tm)return;tm=requestAnimationFrame(()=>{tm=0;pinta()})};
    pinta();
    pv.onclick=e=>{
      if(!fundo)return;const r=pv.getBoundingClientRect(),x=(e.clientX-r.left)*330/r.width,y=(e.clientY-r.top)*330/r.height;
      const kk=330/Math.max(cc.width,cc.height),ww=cc.width*kk,hh=cc.height*kk,nx=(x-(330-ww)/2)/ww,ny=(y-(330-hh)/2)/hh;
      if(nx<0||nx>1||ny<0||ny>1)return;taps.push([nx,ny]);sched();
    };
    Q("#mf").onchange=e=>{fundo=e.target.checked;Q("#mfw").hidden=!fundo;sched()};
    Q("#mi").oninput=e=>{sens=+e.target.value;sched()};
    Q("#md").onclick=()=>{taps.pop();sched()};
    Q("#mv").onclick=()=>{taps=[];tela1()};
    Q("#mo").onclick=()=>{const [o]=mk(logo?400:800,800);o.toBlob(b=>sair(b),logo?"image/png":"image/jpeg",.88)};
  }
  tela1();
}

/* CLIENTES */
function stC(c){
  const vs=D.vendas.filter(v=>v.cliente_id===c.id&&!v.cancelada),n=vs.length;
  const tot=vs.reduce((a,v)=>a+Number(v.total),0),qt=vs.reduce((a,v)=>a+v.qtd,0);
  const t=vs.map(v=>new Date(v.criado_em).getTime()),ult=n?t[n-1]:0,iv=n>1?Math.round((ult-t[0])/(n-1)/864e5):0;
  return {vs,n,tot,qt,ult,iv};
}
function freq(s){
  if(!s.n)return "Ainda não comprou";
  const a=Math.floor((Date.now()-s.ult)/864e5);
  return (s.iv>=1?"Compra a cada ~"+s.iv+(s.iv===1?" dia":" dias")+" · ":"")+(a===0?"última compra hoje":"última compra há "+a+(a===1?" dia":" dias"));
}
function vCli(){
  const e=ec?D.clientes.find(c=>c.id===ec):null;
  const L=D.clientes.map(c=>({c,s:stC(c)})).sort((a,b)=>b.s.tot-a.s.tot);
  const at=L.filter(x=>x.s.n&&Date.now()-x.s.ult<30*864e5).length;
  return `<div class="stats"><div class="stat"><span>Clientes</span><b>${L.length}</b></div><div class="stat"><span>Ativos (30 dias)</span><b>${at}</b></div><div class="stat"><span>Melhor cliente</span><b style="font-size:1rem">${L.length&&L[0].s.tot?esc(L[0].c.nome):"—"}</b></div></div>
  <div class="card"><h2>${e?"Editando: "+esc(e.nome):"Novo cliente"}</h2>
  <label>Nome</label><input id="kn" value="${esc(e&&e.nome)}">
  <label>Telefone / WhatsApp</label><input id="kt" inputmode="tel" value="${esc(e&&e.telefone)}">
  <label>Endereço</label><input id="ke" value="${esc(e&&e.endereco)}">
  <div class="row" style="margin-top:12px"><button class="btn" onclick="salvarCli()">${e?"Salvar alterações":"Adicionar cliente"}</button>${e?`<button class="btn sec" onclick="ec=null;draw()">Cancelar</button>`:""}</div></div>
  <div class="card"><h2>Meus clientes</h2>${L.length?L.map(({c,s})=>`<div class="cl"><b>${esc(c.nome)}</b><small style="display:block;color:var(--mut)">${esc(c.telefone)}${c.endereco?" · "+esc(c.endereco):""}</small>
  <div class="m"><span>Compras: <b>${s.n}</b></span><span>Gasto: <b>${money(s.tot)}</b></span><span>Produtos: <b>${s.qt}</b></span></div>
  <small style="display:block;color:var(--mut)">${freq(s)}</small>
  <div class="row" style="margin-top:8px"><button class="btn sec" onclick="aberto=aberto==='${c.id}'?null:'${c.id}';draw()">Ver compras</button><button class="btn sec" onclick="zapCli('${c.id}')">WhatsApp</button><button class="btn sec" onclick="ec='${c.id}';draw();scrollTo(0,0)">✏️ Editar</button><button class="btn sec" onclick="delCli('${c.id}')">🗑️ Excluir</button></div>
  ${aberto===c.id?'<div class="tip">'+(s.vs.length?[...s.vs].reverse().map(v=>v.qtd+"x "+esc(v.produto_nome)+" – "+money(v.total)+" · "+new Date(v.criado_em).toLocaleDateString("pt-BR")).join("<br>"):"Nenhuma compra registrada.")+"</div>":""}</div>`).join(""):`<div class="empty">Nenhum cliente cadastrado.</div>`}</div>`;
}
async function salvarCli(){
  const nome=$("#kn").value.trim();if(!nome){alert("Informe o nome do cliente.");return}
  const d={nome,telefone:$("#kt").value.trim(),endereco:$("#ke").value.trim()};
  if(!await q(ec?db.from("clientes").update(d).eq("id",ec):db.from("clientes").insert(d)))return;
  ec=null;await load();draw();
}
async function delCli(id){
  const c=D.clientes.find(x=>x.id===id);
  if(!confirm('Excluir o cliente "'+c.nome+'"?\n\nEssa ação não pode ser desfeita. As vendas já registradas continuam no histórico de vendas.'))return;
  if(await q(db.from("clientes").delete().eq("id",id))){if(ec===id)ec=null;await load();draw()}
}
function zapCli(id){const c=D.clientes.find(x=>x.id===id),t=(c.telefone||"").replace(/\D/g,"");if(!t){alert("Cliente sem telefone.");return}window.open("https://wa.me/"+(t.length<=11?"55"+t:t),"_blank")}

/* AJUSTES */
function vCfg(){
  const L=D.loja,link=base()+"?loja="+L.slug;
  return `<div class="card"><h2>Dados da loja</h2>
  <label>Logo da loja</label><div id="lp">${L.logo_url?`<img src="${esc(L.logo_url)}" class="lg" style="display:block;margin:8px 0;border-color:var(--bd)" alt="Logo">`:""}</div>
  <div class="row"><button class="btn sec" onclick="$('#lgf').click()">🖼️ Escolher logo</button><button class="btn sec" onclick="rmLogo()">Remover logo</button></div>
  <input id="lgf" type="file" accept="image/*" hidden onchange="lerLogo(this)">
  <label>Nome da loja</label><input id="cn" value="${esc(L.nome)}">
  <label>Seu WhatsApp (com DDD, ex: 91999998888)</label><input id="cz" inputmode="tel" value="${esc(L.whatsapp)}">
  <div style="margin-top:12px"><button class="btn" onclick="salvarC()">Salvar</button></div></div>
  <div class="card"><h2>Link do catálogo para o cliente</h2><input readonly value="${esc(link)}" onclick="this.select()">
  <div class="row" style="margin-top:10px"><button class="btn" onclick="copiar()">Copiar link</button><a class="btn sec" style="text-align:center;text-decoration:none" href="${esc(link)}" target="_blank">Ver como cliente</a></div></div>
  <div class="card"><b>Conta:</b> <small>entrada com o e-mail cadastrado.</small><div style="margin-top:10px"><button class="btn sec" onclick="sair()">Sair da conta</button></div></div>`;
}
async function salvarC(){
  const d={nome:$("#cn").value.trim()||"Minha Loja",whatsapp:$("#cz").value.trim()};
  if(await q(db.from("lojas").update(d).eq("id",uid))){await load();draw();alert("Salvo!")}
}
async function lerLogo(el){
  const f=el.files[0];el.value="";if(!f)return;
  const b=await cortar(f,true);if(!b)return;
  const u=await up(b,"png");if(!u)return;
  const velho=D.loja.logo_url;
  if(await q(db.from("lojas").update({logo_url:u}).eq("id",uid))){D.loja.logo_url=u;limpar([velho]);draw()}
}
async function rmLogo(){
  if(!D.loja.logo_url||!confirm("Remover a logo da loja?"))return;
  const velho=D.loja.logo_url;
  if(await q(db.from("lojas").update({logo_url:null}).eq("id",uid))){D.loja.logo_url=null;limpar([velho]);draw()}
}
function copiar(){const l=base()+"?loja="+D.loja.slug;try{navigator.clipboard.writeText(l);alert("Link copiado!")}catch(e){alert("Copie manualmente o link do campo.")}}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.closest&&e.target.closest("#auth")){e.preventDefault();const b=$("#abtn");if(b)b.click()}});
db.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY"){modo="nova";uid=null;draw()}});
init();
</script>
</body>
</html>
