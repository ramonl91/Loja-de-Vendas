const ico=(n,s=22)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>{const A=rgb(a),B=rgb(b);return "#"+A.map((v,i)=>Math.round(v*(1-t)+B[i]*t).toString(16).padStart(2,"0")).join("")};
const corBase=()=>{const c=(D.loja&&D.loja.cor)||"acai";return PAL[c]?PAL[c][1]:/^#[0-9a-f]{6}$/i.test(c)?c:PAL.acai[1]};
function aplicarTema(){
  const L=D.loja||{},b=corBase(),mo=L.tema||"auto",dk=mo==="escuro"||(mo==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
  const p=dk?mix(b,"#ffffff",.35):b,lum=(([r,g,bl])=>.299*r+.587*g+.114*bl)(rgb(p));
  const v=dk?{bg:mix(b,"#000000",.88),card:mix(b,"#000000",.8),tx:mix(b,"#ffffff",.92),mut:mix(b,"#ffffff",.6),bd:mix(b,"#000000",.6),pri:p,pri2:mix(b,"#ffffff",.2),g1:mix(b,"#000000",.5),g2:b,warn:"#fb923c"}
   :{bg:mix(b,"#ffffff",.93),card:"#ffffff",tx:mix(b,"#000000",.82),mut:mix(b,"#6b6b6b",.45),bd:mix(b,"#ffffff",.82),pri:b,pri2:mix(b,"#000000",.25),g1:mix(b,"#000000",.4),g2:mix(b,"#ffffff",.12),warn:"#c2410c"};
  const st=document.documentElement.style;for(const k in v)st.setProperty("--"+k,v[k]);st.setProperty("--on",lum>170?"#1a1a1a":"#ffffff");st.setProperty("--sh",dk?"0 1px 2px rgba(0,0,0,.45),0 14px 30px -14px rgba(0,0,0,.7)":"0 1px 2px rgba(30,15,50,.06),0 12px 28px -14px rgba(30,15,50,.2)");
}

async function init(){
  if(SLUG)lss("catLoja",SLUG);
  if(SLUG){
    const {data:l}=await db.from("lojas").select("*").eq("slug",SLUG).maybeSingle();
    if(!l){$("#app").innerHTML='<div class="empty">Loja não encontrada.</div>';return}
    if(l.ativa===false){$("#app").innerHTML='<div class="empty">Catálogo indisponível no momento.</div>';return}
    D.loja=l;document.title=l.nome;
    const [p,c]=await Promise.all([db.from("produtos").select("*").eq("loja_id",l.id).gt("estoque",0),db.from("categorias").select("*").eq("loja_id",l.id)]);
    D.produtos=(p.data||[]).sort(porNome);D.categorias=c.data||[];
  }else{
    await cargaExige();
    const {data:{session}}=await db.auth.getSession();
    if(!session&&ehPWA()&&!lsg("jaLogou")&&lsg("catLoja")){location.replace("?loja="+encodeURIComponent(lsg("catLoja")));return}
    const rec=location.hash.includes("type=recovery");
    if(rec)modo="nova";else if(session){uid=session.user.id;await load()}
  }
  draw();
}
async function load(){
  lss("jaLogou","1");
  const t=(n,f)=>db.from(n).select("*").eq(f,uid);
  const [l,p,c,k,v,pa,it,pg]=await Promise.all([t("lojas","id"),t("produtos","loja_id"),t("categorias","loja_id"),t("clientes","loja_id"),t("vendas","loja_id"),t("parcelas","loja_id"),t("venda_itens","loja_id"),t("pagamentos","loja_id")]);
  D.loja=(l.data||[])[0]||null;
  if(!D.loja){const r=await db.from("lojas").insert({nome:"Minha Loja",slug:uid.replace(/-/g,"")}).select().single();D.loja=r.data}
  if(!D.loja){alert("Esta conta não tem uma loja ativa. Fale com o suporte.");await db.auth.signOut();uid=null;D=novo();return}
  D.produtos=(p.data||[]).sort(porNome);D.categorias=(c.data||[]).sort(porNome);D.clientes=(k.data||[]).sort(porNome);
  D.vendas=(v.data||[]).sort((a,b)=>new Date(a.criado_em)-new Date(b.criado_em));
  D.parcelas=pa.data||[];D.itens=it.data||[];D.pagamentos=pg.data||[];
}
function draw(){
  aplicarTema();atualizaPWA();
  const L=D.loja,lg=$("#hl"),nv=$("#nav");
  lg.style.width=lg.style.height="";$("#hm").style.display="none";if(!$("#hm").firstChild)$("#hm").innerHTML=ico("home",22);
  $("#hs").textContent=SLUG?"Catálogo de produtos":!uid?"Gestão de vendas e estoque":({home:"Painel da loja",produtos:"Produtos",vendas:"Vendas",fin:"Financeiro",clientes:"Clientes",config:"Ajustes"})[tab]||"";
  $("#hn").textContent=(L&&L.nome)||"Minha Loja";
  if(L&&L.logo_url){lg.src=L.logo_url;lg.style.display="block"}else lg.style.display="none";
  if(SLUG){nv.style.display="none";$("#app").innerHTML=vCat();return}
  if(!uid){nv.style.display="none";$("#app").innerHTML=vAuth();return}
  nv.style.display="none";
  if(D.loja&&D.loja.ativa===false){
    const z=(SUPORTE_ZAP||"").replace(/\D/g,"");
    $("#app").innerHTML=`<div class="card" style="max-width:420px;margin:20px auto;text-align:center"><h2>Acesso suspenso</h2><p style="color:var(--mut)">O acesso desta loja está suspenso. Fale com o suporte para regularizar.</p>${z?`<a class="btn" style="display:block;text-decoration:none" target="_blank" href="https://wa.me/${z.length<=11?"55"+z:z}">Falar com o suporte</a>`:""}<div style="margin-top:10px"><button class="btn sec" onclick="sair()">Sair da conta</button></div></div>`;
    return;
  }
  const home=tab==="home";$("#hm").style.display=home?"none":"block";
  if(home){lg.style.width=lg.style.height="104px";nv.style.display="none"}
  else{nv.style.display="flex";nv.innerHTML=[["produtos","box","Produtos"],["vendas","bag","Vendas"],["fin","coin","Financeiro"],["clientes","users","Clientes"],["config","sliders","Ajustes"]].map(([k,i,l])=>`<button class="${tab===k?"on":""}" ${tab===k?'aria-current="page"':""} onclick="tab='${k}';draw();scrollTo(0,0)">${ico(i,22)}<span>${l}</span></button>`).join("")}
  $("#app").innerHTML=({home:vHome,produtos:vProd,vendas:vVen,fin:vFin,clientes:vCli,config:vCfg})[tab]();
}

/* ENTRAR / CRIAR LOJA */
function pw(id,ac){return `<div style="position:relative"><input id="${id}" type="password" autocomplete="${ac}" style="padding-right:48px"><button type="button" onclick="ver('${id}',this)" aria-label="Mostrar ou ocultar senha" style="position:absolute;right:4px;top:4px;bottom:4px;width:40px;border:0;background:transparent;font-size:1.1rem;cursor:pointer;color:var(--mut)">${ico("eye",20)}</button></div>`}
function ver(id,b){const i=$("#"+id),m=i.type==="password";i.type=m?"text":"password";b.innerHTML=m?ico("eyeoff",20):ico("eye",20)}
function vAuth(){
  const c=modo==="criar",e=modo==="esqueci",n=modo==="nova";
  const tit=c?"Criar minha loja":e?"Recuperar senha":n?"Criar nova senha":"Entrar";
  const acao=c?"criar()":e?"recuperar()":n?"novaSenha()":"entrar()";
  const lnk=(m,t)=>`<a href="#" onclick="modo='${m}';draw();return false" style="color:var(--pri)">${t}</a>`;
  return `<div id="auth" class="card" style="max-width:420px;margin:20px auto"><h2>${tit}</h2>
  ${c?`<label>Nome da loja</label><input id="an" oninput="sg()"><label>Endereço do catálogo (sem espaços)</label><input id="as" placeholder="ex: natura-maria" oninput="this.dataset.t=1">${exige?`<label>Código de ativação</label><input id="ac" placeholder="XXXX-XXXX-XXXX-XXXX" autocapitalize="characters" autocomplete="off">`:""}`:""}
  ${n?"":`<label>E-mail</label><input id="ae" type="email" autocomplete="email">`}
  ${e?`<div class="tip">Enviaremos um link para você criar uma nova senha.</div>`:`<label>${n?"Nova senha":"Senha"} ${c||n?"(mínimo 6 caracteres)":""}</label>${pw("ap",c||n?"new-password":"current-password")}`}
  ${c||n?`<label>Confirmar senha</label>${pw("ap2","new-password")}`:""}
  <div style="margin-top:12px"><button id="abtn" class="btn" style="width:100%" onclick="${acao}">${tit}</button></div>
  <p style="text-align:center;line-height:2">${modo==="entrar"?lnk("esqueci","Esqueci minha senha")+"<br>"+lnk("criar","Criar minha loja"):n?"":lnk("entrar","Voltar para entrar")}</p></div>`;
}
function sg(){const s=$("#as");if(!s.dataset.t)s.value=slugify($("#an").value)}
async function entrar(){
  const {data,error}=await db.auth.signInWithPassword({email:$("#ae").value.trim(),password:$("#ap").value});
  if(error){alert(/confirm/i.test(error.message)?"Seu e-mail ainda não foi confirmado. Abra o link que enviamos para o seu e-mail.":"E-mail ou senha incorretos. Use o olhinho 👁️ para conferir a senha digitada.");return}
  uid=data.user.id;await load();tab="home";draw();
}
async function criar(){
  const nome=$("#an").value.trim(),slug=slugify($("#as").value),email=$("#ae").value.trim(),senha=$("#ap").value;
  if(!nome||!slug||!email||senha.length<6){alert("Preencha todos os campos. A senha precisa ter 6 caracteres ou mais.");return}
  if(senha!==$("#ap2").value){alert("As senhas digitadas não são iguais.");return}
  const {data:ex}=await db.from("lojas").select("id").eq("slug",slug).maybeSingle();
  if(ex){alert("Esse endereço já está em uso. Escolha outro.");return}
  let codigo="";
  if(exige){
    codigo=($("#ac")?$("#ac").value:"").trim().toUpperCase();
    if(!codigo){alert("Digite o código de ativação que você recebeu na compra.");return}
    const {data:vl}=await db.rpc("codigo_valido",{c:codigo});
    if(!vl){alert("Código de ativação inválido ou já utilizado.");return}
  }
  const {data,error}=await db.auth.signUp({email,password:senha,options:{data:{nome,slug,codigo}}});
  if(error){alert(/database error/i.test(error.message)?"Não foi possível criar a conta. Confira o código de ativação e o endereço do catálogo.":"Não foi possível criar a conta: "+error.message);return}
  if(!data.session){alert("Conta criada! Confirme o link enviado ao seu e-mail e depois entre.");modo="entrar";draw();return}
  uid=data.user.id;await load();tab="home";draw();
}
async function recuperar(){
  const email=$("#ae").value.trim();if(!email){alert("Digite o seu e-mail.");return}
  const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:base()});
  if(error){alert("Não foi possível enviar: "+error.message);return}
  alert("Se esse e-mail estiver cadastrado, você receberá um link para criar uma nova senha. Olhe também a caixa de spam.");modo="entrar";draw();
}
async function novaSenha(){
  const a=$("#ap").value;
  if(a.length<6){alert("A senha precisa ter 6 caracteres ou mais.");return}
  if(a!==$("#ap2").value){alert("As senhas digitadas não são iguais.");return}
  const {data,error}=await db.auth.updateUser({password:a});
  if(error){alert("Não foi possível alterar a senha: "+error.message);return}
  history.replaceState(null,"",base());uid=data.user.id;await load();tab="home";draw();alert("Senha alterada com sucesso!");
}
async function sair(){if(!confirm("Sair da conta?"))return;await db.auth.signOut();uid=null;D=novo();modo="entrar";draw()}

function vCat(){
  const ds=D.produtos.filter(p=>!gf||p.categoria_id===gf);
  const n=Object.keys(cart).reduce((a,k)=>a+cart[k],0);
  const ids=[...new Set(D.produtos.map(p=>p.categoria_id).filter(Boolean))];
  const b=(i,l)=>`<button class="chip ${gf===i?"on":""}" data-g="${i}" onclick="gf=this.dataset.g;draw()">${esc(l)}</button>`;
  let h=ids.length?`<div class="chips">${b("","Todos")}${ids.map(i=>b(i,catNome(i))).join("")}</div>`:"";
  h=cartaoInst()+h;
  h+=ds.length?`<div class="grid">${ds.map(p=>`<div class="p">${galeria(p)}<div class="i"><b>${esc(p.nome)}</b><small>${esc(p.descricao)}</small><span class="price">${money(p.preco)}</span><button class="btn" onclick="add('${p.id}')">Adicionar</button></div></div>`).join("")}</div>`:`<div class="empty">Nenhum produto disponível no momento.</div>`;
  if(n)h+=`<div class="cart"><button class="btn" onclick="enviar()">Enviar pedido no WhatsApp (${n} ${n>1?"itens":"item"})</button></div>`;
  return h;
}
function add(id){const p=D.produtos.find(x=>x.id===id);if((cart[id]||0)<p.estoque)cart[id]=(cart[id]||0)+1;draw()}
function enviar(){
  const num=(D.loja.whatsapp||"").replace(/\D/g,"");
  if(!num){alert("O lojista ainda não configurou o WhatsApp.");return}
  let tot=0;const l=Object.keys(cart).map(id=>{const p=D.produtos.find(x=>x.id===id),s=p.preco*cart[id];tot+=s;return "• "+cart[id]+"x "+p.nome+" – "+money(s)});
  window.open("https://wa.me/"+(num.length<=11?"55"+num:num)+"?text="+encodeURIComponent("Olá! Gostaria de fazer este pedido:\n"+l.join("\n")+"\nTotal: "+money(tot)),"_blank");
  cart={};draw();
}

function reduzir(f,max,tipo,cb){
  const r=new FileReader();
  r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(cb,tipo,.75)};i.src=r.result};
  r.readAsDataURL(f);
}
function fotosHTML(){
  const n=fotosEdit.length;
  return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">${fotosEdit.map((f,i)=>`<div style="position:relative;width:92px"><img src="${esc(f.prev)}" style="width:92px;height:92px;object-fit:cover;border-radius:10px;display:block" alt=""><button class="btn" type="button" style="position:absolute;top:3px;right:3px;padding:2px 8px;background:var(--warn)" onclick="rmFoto(${i})" aria-label="Excluir foto">✕</button>${i===0?`<small style="display:block;text-align:center;color:var(--pri)">Capa</small>`:`<button class="btn sec" type="button" style="width:100%;padding:3px;font-size:.72rem;margin-top:2px" onclick="capa(${i})">Tornar capa</button>`}</div>`).join("")}</div><small style="color:var(--mut)">${n}/3 fotos</small>`;
}
const attF=()=>{$("#fotos").innerHTML=fotosHTML()};
function iniEdit(id){const p=D.produtos.find(x=>x.id===id);edit=id;rem=[];fotosEdit=lista(p).map(u=>({url:u,prev:u}));draw();scrollTo(0,0)}
function rmFoto(i){if(!confirm("Excluir esta foto?"))return;const f=fotosEdit[i];if(f.url)rem.push(f.url);fotosEdit.splice(i,1);attF()}
function capa(i){fotosEdit.unshift(fotosEdit.splice(i,1)[0]);attF()}
const pathDe=u=>{const k="/fotos/",i=(u||"").indexOf(k);if(i<0)return null;const t=decodeURIComponent(u.slice(i+k.length));return t.startsWith(uid+"/")?t:null};
const limpar=us=>{const l=us.map(pathDe).filter(Boolean);if(l.length)db.storage.from("fotos").remove(l)};
async function addFoto(f){
  if(fotosEdit.length>=3){alert("Máximo de 3 fotos. Exclua uma para adicionar outra.");return}
  const b=await cortar(f,false);if(!b)return;
  fotosEdit.push({blob:b,prev:URL.createObjectURL(b)});attF();
}
function lerFoto(el){const f=el.files[0];el.value="";if(f)addFoto(f)}
async function tirarFoto(){
  if(fotosEdit.length>=3){alert("Máximo de 3 fotos. Exclua uma para adicionar outra.");return}
  const C=window.Capacitor,cam=C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.Camera;
  if(!cam){$("#cam").click();return}
  try{const r=await cam.getPhoto({quality:80,resultType:"dataUrl",source:"CAMERA",width:1400});addFoto(await (await fetch(r.dataUrl)).blob())}catch(e){}
}

/* FERRAMENTA DE CORTE */
function cortar(file,logo){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();im.onload=()=>abrirCorte(im,logo,res);im.src=fr.result};
    fr.readAsDataURL(file);
  });
}
function abrirCorte(im,logo,res){
  const src=document.createElement("canvas"),k0=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight));
  src.width=Math.round(im.naturalWidth*k0);src.height=Math.round(im.naturalHeight*k0);src.getContext("2d").drawImage(im,0,0,src.width,src.height);
  let quad=true,ds,dw,dh,cr;
  const m=document.createElement("div");
  m.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto";
  document.body.appendChild(m);
  const Q=s=>m.querySelector(s),sair=v=>{m.remove();res(v)};
  const lay=()=>{ds=Math.min(330/src.width,360/src.height);dw=Math.round(src.width*ds);dh=Math.round(src.height*ds);
    const s=Math.min(dw,dh)*.85;cr=quad?{x:(dw-s)/2,y:(dh-s)/2,w:s,h:s}:{x:dw*.075,y:dh*.075,w:dw*.85,h:dh*.85}};
  lay();
  function tela(){
    m.innerHTML=`<div class="card" style="width:100%;max-width:380px;margin:0"><h2>Cortar ${logo?"logo":"foto"}</h2>
    <canvas id="mcv" style="display:block;margin:auto;max-width:100%;touch-action:none;border-radius:8px"></canvas>
    <small style="color:var(--mut);display:block;margin-top:6px">Arraste os cantos para cortar e o meio para mover o recorte.</small>
    <div class="row" style="margin-top:10px"><button class="btn ${quad?"":"sec"}" id="mq" style="min-width:0">Quadrado</button><button class="btn ${quad?"sec":""}" id="ml" style="min-width:0">Livre</button><button class="btn sec" id="mg" style="min-width:0">↺ Girar</button></div>
    <div class="row" style="margin-top:10px"><button class="btn sec" id="mx" style="min-width:0">Cancelar</button><button class="btn" id="mn" style="min-width:0">Usar foto</button></div></div>`;
    const cv=Q("#mcv");cv.width=dw;cv.height=dh;const c=cv.getContext("2d");
    const cantos=()=>[[cr.x,cr.y],[cr.x+cr.w,cr.y],[cr.x,cr.y+cr.h],[cr.x+cr.w,cr.y+cr.h]];
    const pinta=()=>{
      c.drawImage(src,0,0,dw,dh);c.fillStyle="rgba(0,0,0,.55)";
      c.fillRect(0,0,dw,cr.y);c.fillRect(0,cr.y+cr.h,dw,dh-cr.y-cr.h);c.fillRect(0,cr.y,cr.x,cr.h);c.fillRect(cr.x+cr.w,cr.y,dw-cr.x-cr.w,cr.h);
      c.strokeStyle="#fff";c.lineWidth=2;c.strokeRect(cr.x,cr.y,cr.w,cr.h);
      c.lineWidth=1;c.strokeStyle="rgba(255,255,255,.45)";c.beginPath();
      for(let i=1;i<3;i++){c.moveTo(cr.x+cr.w*i/3,cr.y);c.lineTo(cr.x+cr.w*i/3,cr.y+cr.h);c.moveTo(cr.x,cr.y+cr.h*i/3);c.lineTo(cr.x+cr.w,cr.y+cr.h*i/3)}
      c.stroke();c.fillStyle="#fff";c.strokeStyle="#222";
      for(const [x,y] of cantos()){c.fillRect(x-9,y-9,18,18);c.strokeRect(x-9,y-9,18,18)}
    };
    pinta();
    const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*dw/r.width,(e.clientY-r.top)*dh/r.height]};
    let mod=null;
    cv.onpointerdown=e=>{
      const [x,y]=pt(e),cs=cantos();let i=-1,md=36;
      cs.forEach(([a,b],k)=>{const dd=Math.hypot(a-x,b-y);if(dd<md){md=dd;i=k}});
      if(i>=0){const [ax,ay]=cs[3-i];mod={t:"r",ax,ay}}
      else if(x>cr.x&&x<cr.x+cr.w&&y>cr.y&&y<cr.y+cr.h)mod={t:"m",dx:x-cr.x,dy:y-cr.y};
      if(mod)cv.setPointerCapture(e.pointerId);
    };
    cv.onpointermove=e=>{
      if(!mod)return;let [x,y]=pt(e);
      if(mod.t==="m"){cr.x=Math.max(0,Math.min(dw-cr.w,x-mod.dx));cr.y=Math.max(0,Math.min(dh-cr.h,y-mod.dy))}
      else{
        x=Math.max(0,Math.min(dw,x));y=Math.max(0,Math.min(dh,y));
        const sx=x>=mod.ax?1:-1,sy=y>=mod.ay?1:-1;let w=Math.abs(x-mod.ax),h=Math.abs(y-mod.ay);
        if(quad){let s=Math.max(w,h);s=Math.min(s,sx>0?dw-mod.ax:mod.ax,sy>0?dh-mod.ay:mod.ay);w=h=Math.max(s,48)}
        else{w=Math.max(w,48);h=Math.max(h,48)}
        cr.x=Math.max(0,Math.min(dw-w,sx>0?mod.ax:mod.ax-w));cr.y=Math.max(0,Math.min(dh-h,sy>0?mod.ay:mod.ay-h));cr.w=w;cr.h=h;
      }
      pinta();
    };
    cv.onpointerup=cv.onpointercancel=()=>{mod=null};
    Q("#mq").onclick=()=>{quad=true;const s=Math.min(cr.w,cr.h),cx0=cr.x+cr.w/2,cy0=cr.y+cr.h/2;
      cr={x:Math.max(0,Math.min(dw-s,cx0-s/2)),y:Math.max(0,Math.min(dh-s,cy0-s/2)),w:s,h:s};tela()};
    Q("#ml").onclick=()=>{quad=false;tela()};
    Q("#mg").onclick=()=>{
      const t=document.createElement("canvas");t.width=src.height;t.height=src.width;const tc=t.getContext("2d");
      tc.translate(t.width/2,t.height/2);tc.rotate(Math.PI/2);tc.drawImage(src,-src.width/2,-src.height/2);
      src.width=t.width;src.height=t.height;src.getContext("2d").drawImage(t,0,0);lay();tela();
    };
    Q("#mx").onclick=()=>sair(null);
    Q("#mn").onclick=()=>{
      const sw=cr.w/ds,sh=cr.h/ds,OUT=logo?400:800,o=document.createElement("canvas");o.width=o.height=OUT;const oc=o.getContext("2d");
      if(!logo){oc.fillStyle="#fff";oc.fillRect(0,0,OUT,OUT)}

      oc.drawImage(src,cr.x/ds,cr.y/ds,sw,sh,(OUT-ww)/2,(OUT-hh)/2,ww,hh);
      o.toBlob(b=>sair(b),logo?"image/png":"image/jpeg",.88);
    };
  }
  tela();
}

function plano(total,n,entrada,venc,inter){
  const [Y,M,Dd]=venc.split("-").map(Number),resto=Math.round((total-entrada)*100),base=Math.floor(resto/n),a=[];
  for(let i=0;i<n;i++){
    let d;
    if(inter==="mensal"){const t=new Date(Y,M-1+i,1),ult=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();d=new Date(t.getFullYear(),t.getMonth(),Math.min(Dd,ult))}
    else d=new Date(Y,M-1,Dd+i*(inter==="quinzenal"?15:7));
    a.push({numero:i+1,valor:(i===n-1?resto-base*(n-1):base)/100,vencimento:fmtD(d)});
  }
  return a;
}

    const pr=o.ps[0],ab=abre===o.k;
    return `<div class="cl ${o.atr?"atrasado":"debito"}"><b>${esc(o.nome)}</b> ${o.atr?'<span class="tag atrasado">ATRASADO</span>':'<span class="tag debito">EM DÉBITO</span>'}
    <div class="m"><span>Faltam: <b>${o.ps.filter(x=>x.numero>0).length} parcela(s)</b></span><span>Em aberto: <b>${money(o.tot)}</b></span><span>Próxima: <b class="${pr.vencimento<hj?"late":""}">${br(pr.vencimento)}</b></span></div>
    <div class="row"><button class="btn" data-k="${esc(o.k)}" onclick="abrirReceb(this.dataset.k)" style="min-width:0">Receber</button><button class="btn sec" data-k="${esc(o.k)}" onclick="abrirR(this.dataset.k)" style="min-width:0">${ab?"Fechar":"Parcelas"}</button><button class="btn sec" data-k="${esc(o.k)}" onclick="cobrar(this.dataset.k)" style="min-width:0">Cobrar</button></div>
    ${ab?detParc(o):""}</div>`}).join("")}</div>`;
}
function abrirR(k){abre=abre===k?null:k;draw()}
function detParc(o){
  const hj=hoje(),vs=[...new Set(o.ps.map(x=>x.venda_id))];
  return `<div class="tip" style="margin-top:10px">${vs.map(id=>{
    const v=D.vendas.find(y=>y.id===id),ps=D.parcelas.filter(x=>x.venda_id===id).sort((a,b)=>a.numero-b.numero),pg=D.pagamentos.filter(x=>x.venda_id===id).sort((a,b)=>new Date(a.pago_em)-new Date(b.pago_em));
    return `<div style="margin-top:10px"><b>${esc(vLabel(v))}</b> <small>· total ${money(v.total)} · ${new Date(v.criado_em).toLocaleDateString("pt-BR")}</small>${ps.map(x=>`<div class="it" style="padding:6px 0"><div class="t"><b>${x.numero===0?"Entrada":x.numero+"/"+v.n_parcelas}</b> · ${br(x.vencimento)} · ${money(x.valor)}<small>${x.paga?"✓ paga":(x.valor_pago>0?"parcial: pago "+money(x.valor_pago)+" · falta "+money(rest(x)):(x.vencimento<hj?'<span class="late">atrasada</span>':"a vencer"))}</small></div>${x.paga?"":`<button class="btn" style="padding:6px 10px" data-k="${esc(o.k)}" data-p="${x.id}" onclick="abrirReceb(this.dataset.k,this.dataset.p)">Receber</button>`}</div>`).join("")}
    ${pg.length?`<small style="display:block;margin-top:6px;color:var(--mut)">Recebimentos:</small>${pg.map(g=>`<div class="it" style="padding:4px 0"><div class="t"><small>${new Date(g.pago_em).toLocaleDateString("pt-BR")} · ${esc(g.forma||"")} · <b>${money(g.valor)}</b></small></div><button class="btn sec" style="padding:4px 8px;font-size:.72rem" onclick="estornar('${g.id}')">Estornar</button></div>`).join("")}`:""}</div>`}).join("")}</div>`;
}
function alocar(ps,valor){
  let r=Math.round(valor*100);const out=[];
  for(const x of ps){if(r<=0)break;const f=Math.round(rest(x)*100),a=Math.min(r,f);if(a>0){out.push({x,v:a/100,quita:a===f});r-=a}}
  return {out,sobra:r/100};
}
function abrirReceb(k,pid){
  let ps=parcsCli(k);if(!ps.length)return;
  const reqRec=uuid();
  if(pid){const f=ps.find(x=>x.id===pid);if(f)ps=[f,...ps.filter(x=>x!==f)]}
  const v0=D.vendas.find(y=>y.id===ps[0].venda_id),max=somaR(ps);
  const m=modal(`<h2>Receber pagamento</h2><small style="color:var(--mut)">${esc(v0.cliente_nome||"Cliente")} · em aberto: <b>${money(max)}</b></small>
  <label>Valor recebido (R$)</label><input id="rv" type="number" step="0.01" min="0.01" value="${rest(ps[0])}">
  <label>Forma de recebimento</label><select id="rf"><option value="">Selecione a forma</option>${FORMAS.map(opt).join("")}</select>
  <div class="tip" id="rp"></div>
  <div class="row" style="margin-top:12px"><button class="btn sec" id="rx" style="min-width:0">Cancelar</button><button class="btn" id="ro" style="min-width:0">Confirmar recebimento</button></div>`);
  const Q=x=>m.querySelector(x),val=()=>Math.round((parseFloat(Q("#rv").value)||0)*100)/100;
  const pv=()=>{
    const v=val();
    if(v<=0){Q("#rp").textContent="Informe o valor recebido.";return}
    if(v>max+0.004){Q("#rp").innerHTML='<span class="late">O valor é maior que o total em aberto ('+money(max)+').</span>';return}
    Q("#rp").innerHTML=alocar(ps,v).out.map(a=>{const vd=D.vendas.find(y=>y.id===a.x.venda_id);return (a.x.numero===0?"Entrada":"Parcela "+a.x.numero+"/"+vd.n_parcelas)+" ("+br(a.x.vencimento)+"): <b>"+money(a.v)+"</b> "+(a.quita?"✓ quita":"· parcial, falta "+money(Math.round((rest(a.x)-a.v)*100)/100))}).join("<br>");
  };
  Q("#rv").oninput=pv;pv();
  Q("#rx").onclick=()=>m.remove();
  Q("#ro").onclick=()=>unico("receber",async()=>{
    const v=val(),f=Q("#rf").value;
    if(v<=0){alert("Informe o valor recebido.");return}
    if(v>max+0.004){alert("O valor é maior que o total em aberto ("+money(max)+").");return}
    if(!f){alert("Selecione a forma de recebimento.");return}
    const bt=Q("#ro");bt.disabled=true;bt.textContent="Registrando...";
    const semId=k.startsWith("n:");
    await q(db.rpc("receber_pagamento",{p_req:reqRec,p_cliente:semId?null:k,p_nome:semId?k.slice(2):null,p_primeira:pid||null,p_valor:v,p_forma:f,p_saldo_tela:max}));
    m.remove();await load();draw();
  });
}
async function estornar(id){
  const g=D.pagamentos.find(y=>y.id===id);if(!g)return;
  if(!confirm("Estornar este recebimento de "+money(g.valor)+" ("+(g.forma||"")+")?\nO valor sai do caixa e volta para o que o cliente deve."))return;
  return unico("estornar"+id,async()=>{await q(db.rpc("estornar_pagamento",{p_pag:id}));await load();draw()});
}
function cobrar(k){
  const ps=parcsCli(k);if(!ps.length)return;
  const x=ps[0],v=D.vendas.find(y=>y.id===x.venda_id),c=D.clientes.find(y=>y.id===v.cliente_id),t=((c&&c.telefone)||"").replace(/\D/g,"");
  if(!t){alert("Esse cliente não tem telefone cadastrado. Edite o cadastro na aba Clientes.");return}
  const msg="Olá, "+(v.cliente_nome||"tudo bem")+"! Passando para lembrar da parcela "+x.numero+"/"+v.n_parcelas+" de "+money(rest(x))+", com vencimento em "+br(x.vencimento)+". Qualquer dúvida é só me chamar!";
  window.open("https://wa.me/"+(t.length<=11?"55"+t:t)+"?text="+encodeURIComponent(msg),"_blank");
}
const stCli=id=>{const ps=D.parcelas.filter(x=>x.cliente_id===id&&!x.paga&&ativa(x.venda_id));if(!ps.length)return "";return ps.some(x=>x.vencimento<hoje())?"atrasado":"debito"};
const tagCli=id=>{const s=stCli(id);return s?` <span class="tag ${s}">${s==="atrasado"?"ATRASADO":"EM DÉBITO"}</span>`:""};
function enviarCat(){
  const link=base()+"?loja="+D.loja.slug,loja=D.loja.nome||"minha loja";
  const m=document.createElement("div");
  m.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto";
  const comTel=D.clientes.filter(c=>(c.telefone||"").replace(/\D/g,""));
  m.innerHTML=`<div class="card" style="width:100%;max-width:380px;margin:0"><h2>Enviar catálogo</h2>
  <label>Cliente cadastrado</label><select id="wc"><option value="">Escolher o contato no WhatsApp</option>${comTel.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join("")}</select>
  <label>Ou digite o número (com DDD)</label><input id="wn" inputmode="tel" placeholder="91999998888">
  <label>Mensagem</label><textarea id="wm" rows="4"></textarea>
  <div class="row" style="margin-top:12px"><button class="btn sec" id="wx" style="min-width:0">Fechar</button><button class="btn" id="wo" style="min-width:0">Abrir WhatsApp</button></div>
  <div style="margin-top:8px"><button class="btn sec" style="width:100%" id="wl">Copiar link</button></div></div>`;
  document.body.appendChild(m);
  const Q=x=>m.querySelector(x);let editada=false;
  const msg=n=>"Olá"+(n?", "+n:"")+"! Conheça o catálogo da "+loja+", com os produtos disponíveis: "+link;
  Q("#wm").value=msg("");Q("#wm").oninput=()=>{editada=true};
  Q("#wc").onchange=()=>{const c=D.clientes.find(x=>x.id===Q("#wc").value);if(c&&!editada)Q("#wm").value=msg(c.nome.split(" ")[0]);if(c)Q("#wn").value=""};
  Q("#wx").onclick=()=>m.remove();
  Q("#wl").onclick=()=>{try{navigator.clipboard.writeText(link);alert("Link copiado!")}catch(e){alert(link)}};
  Q("#wo").onclick=()=>{
    const c=D.clientes.find(x=>x.id===Q("#wc").value);
    const t=((c&&c.telefone)||Q("#wn").value).replace(/\D/g,"");
    window.open("https://wa.me/"+(t?(t.length<=11?"55"+t:t):"")+"?text="+encodeURIComponent(Q("#wm").value),"_blank");
    m.remove();
  };
}
function vHome(){
  const baixo=D.produtos.filter(p=>p.estoque<=2).length,devendo=D.clientes.filter(c=>stCli(c.id)).length,atras=D.clientes.filter(c=>stCli(c.id)==="atrasado").length;
  const fb=devendo?devendo+" cliente"+(devendo>1?"s":"")+" em débito"+(atras?" · "+atras+" atrasado"+(atras>1?"s":""):""):"";
  const it=[["produtos","box","Produtos",baixo?baixo+" com estoque baixo":"",""],["vendas","bag","Vendas","",""],["fin","coin","Financeiro",fb,atras?"r":""],["clientes","users","Clientes","",""],["config","sliders","Ajustes","",""]];
  return `${D.loja&&D.loja.logo_url?"":`<div class="tip" style="margin:0 0 14px">Dica: em Ajustes você pode colocar a logo da sua loja.</div>`}${cartaoInst()}<div class="hgrid"><button class="hcard main" onclick="enviarCat()"><span class="he">${ico("send",26)}</span><span style="text-align:left"><b>Enviar catálogo</b><small style="display:block;opacity:.85;font-weight:500">Compartilhe o link da loja no WhatsApp</small></span></button>${it.map(([k,e,l,b,r])=>`<button class="hcard" onclick="tab='${k}';draw()"><span class="he">${ico(e,26)}</span><b>${l}</b>${b?`<small class="hb ${r}">${b}</small>`:""}</button>`).join("")}</div>`;
}
const aRec=id=>{const ps=D.parcelas.filter(x=>x.cliente_id===id&&!x.paga&&ativa(x.venda_id));if(!ps.length)return "";return `<small style="display:block;color:var(--pri)">A receber: <b>${money(somaR(ps))}</b> · faltam ${ps.length} parcela${ps.length>1?"s":""}</small>`};

/* CLIENTES */
function stC(c){
  const vs=D.vendas.filter(v=>v.cliente_id===c.id&&!v.cancelada),n=vs.length;
  const tot=vs.reduce((a,v)=>a+Number(v.total),0),qt=vs.reduce((a,v)=>a+v.qtd,0);
  const t=vs.map(v=>new Date(v.criado_em).getTime()),ult=n?t[n-1]:0,iv=n>1?Math.round((ult-t[0])/(n-1)/864e5):0;
  return {vs,n,tot,qt,ult,iv};
}
function freq(s){
  if(!s.n)return "Ainda não comprou";
  const a=Math.floor((Date.now()-s.ult)/864e5);
  return (s.iv>=1?"Compra a cada ~"+s.iv+(s.iv===1?" dia":" dias")+" · ":"")+(a===0?"última compra hoje":"última compra há "+a+(a===1?" dia":" dias"));
}
function vCli(){
  const e=ec?D.clientes.find(c=>c.id===ec):null;
  const L=D.clientes.map(c=>({c,s:stC(c)})).sort((a,b)=>b.s.tot-a.s.tot);
  const at=L.filter(x=>x.s.n&&Date.now()-x.s.ult<30*864e5).length;
  return `<div class="stats"><div class="stat"><span>Clientes</span><b>${L.length}</b></div><div class="stat"><span>Ativos (30 dias)</span><b>${at}</b></div><div class="stat"><span>Em débito</span><b ${L.some(x=>stCli(x.c.id))?'style="color:#dc2626"':""}>${L.filter(x=>stCli(x.c.id)).length}</b></div><div class="stat"><span>Melhor cliente</span><b style="font-size:1rem">${L.length&&L[0].s.tot?esc(L[0].c.nome):"—"}</b></div></div>
  <div class="card"><h2>${e?"Editando: "+esc(e.nome):"Novo cliente"}</h2>
  <label>Nome</label><input id="kn" value="${esc(e&&e.nome)}">
  <label>Telefone / WhatsApp</label><input id="kt" inputmode="tel" value="${esc(e&&e.telefone)}">
  <label>Endereço</label><input id="ke" value="${esc(e&&e.endereco)}">
  <div class="row" style="margin-top:12px"><button class="btn" onclick="salvarCli()">${e?"Salvar alterações":"Adicionar cliente"}</button>${e?`<button class="btn sec" onclick="ec=null;draw()">Cancelar</button>`:""}</div></div>
  <div class="card"><h2>Meus clientes</h2>${L.length?L.map(({c,s})=>`<div class="cl ${stCli(c.id)}"><b>${esc(c.nome)}</b>${tagCli(c.id)}<small style="display:block;color:var(--mut)">${esc(c.telefone)}${c.endereco?" · "+esc(c.endereco):""}</small>
  <div class="m"><span>Compras: <b>${s.n}</b></span><span>Gasto: <b>${money(s.tot)}</b></span><span>Produtos: <b>${s.qt}</b></span></div>
  <small style="display:block;color:var(--mut)">${freq(s)}</small>${aRec(c.id)}
  <div class="row" style="margin-top:8px"><button class="btn sec" onclick="aberto=aberto==='${c.id}'?null:'${c.id}';draw()">Ver compras</button><button class="btn sec" onclick="zapCli('${c.id}')">WhatsApp</button><button class="btn sec" onclick="ec='${c.id}';draw();scrollTo(0,0)">${ico("edit",16)} Editar</button><button class="btn sec" onclick="delCli('${c.id}')">${ico("trash",16)} Excluir</button></div>
  ${aberto===c.id?'<div class="tip">'+(s.vs.length?[...s.vs].reverse().map(v=>esc(vLabel(v))+" – "+money(v.total)+" · "+new Date(v.criado_em).toLocaleDateString("pt-BR")).join("<br>"):"Nenhuma compra registrada.")+"</div>":""}</div>`).join(""):`<div class="empty">Nenhum cliente cadastrado.</div>`}</div>`;
}
function salvarCli(){return unico("salvarCli",salvarCli0)}
async function salvarCli0(){
  const nome=$("#kn").value.trim();if(!nome){alert("Informe o nome do cliente.");return}
  const d={nome,telefone:$("#kt").value.trim(),endereco:$("#ke").value.trim()};
  if(!await q(ec?db.from("clientes").update(d).eq("id",ec):db.from("clientes").insert(d)))return;
  ec=null;await load();draw();
}
function delCli(id){return unico("delCli"+id,()=>delCli0(id))}
async function delCli0(id){
  const c=D.clientes.find(x=>x.id===id);
  if(!confirm('Excluir o cliente "'+c.nome+'"?\n\nEssa ação não pode ser desfeita. As vendas já registradas continuam no histórico de vendas.'))return;
  if(await q(db.from("clientes").delete().eq("id",id))){if(ec===id)ec=null;await load();draw()}
}
function zapCli(id){const c=D.clientes.find(x=>x.id===id),t=(c.telefone||"").replace(/\D/g,"");if(!t){alert("Cliente sem telefone.");return}window.open("https://wa.me/"+(t.length<=11?"55"+t:t),"_blank")}

/* AJUSTES */
function vCfg(){
  const L=D.loja,link=base()+"?loja="+L.slug;
  return `<div class="card"><h2>Dados da loja</h2>
  <label>Logo da loja</label><div id="lp">${L.logo_url?`<img src="${esc(L.logo_url)}" class="lg" style="display:block;margin:8px 0;border-color:var(--bd)" alt="Logo">`:""}</div>
  <div class="row"><button class="btn sec" onclick="$('#lgf').click()">${ico("img",18)} Escolher logo</button><button class="btn sec" onclick="rmLogo()">Remover logo</button></div>
  <input id="lgf" type="file" accept="image/*" hidden onchange="lerLogo(this)">
  <label>Nome da loja</label><input id="cn" value="${esc(L.nome)}">
  <label>Seu WhatsApp (com DDD, ex: 91999998888)</label><input id="cz" inputmode="tel" value="${esc(L.whatsapp)}">
  <div style="margin-top:12px"><button class="btn" onclick="salvarC()">Salvar</button></div></div>
  <div class="card"><h2>Link do catálogo para o cliente</h2><input readonly value="${esc(link)}" onclick="this.select()">
  <div class="row" style="margin-top:10px"><button class="btn" onclick="copiar()">Copiar link</button><a class="btn sec" style="text-align:center;text-decoration:none" href="${esc(link)}" target="_blank">Ver como cliente</a></div></div>
  <div class="card"><h2>Aparência</h2>
  <label>Modo</label><div class="chips" style="padding-bottom:4px">${[["auto","Automático"],["claro","Claro"],["escuro","Escuro"]].map(([k,l])=>`<button class="chip ${(L.tema||"auto")===k?"on":""}" onclick="setTema('tema','${k}')">${l}</button>`).join("")}</div>
  <label>Cor do programa</label><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">${Object.entries(PAL).map(([k,[n,h]])=>`<button class="sw ${(L.cor||"acai")===k?"on":""}" title="${n}" aria-label="${n}" style="background:${h}" onclick="setTema('cor','${k}')"></button>`).join("")}<span style="display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--mut)">Outra: <input type="color" value="${corBase()}" onchange="setTema('cor',this.value)" style="width:44px;height:34px;padding:2px"></span></div>
  <small style="color:var(--mut);display:block;margin-top:8px">A cor também aparece no catálogo dos seus clientes. O modo Automático segue o celular de quem está vendo.</small></div>
  <div class="card"><h2>Instalar no celular</h2><small style="color:var(--mut)">${ehPWA()?"O programa já está instalado neste aparelho.":"Coloque o programa na tela inicial para abrir como um aplicativo, sem digitar o endereço."}</small>${ehPWA()?"":`<div style="margin-top:10px"><button class="btn" onclick="instalar()">${ico("phone",18)} ${instEvt?"Instalar agora":"Como instalar"}</button></div>`}</div>
  <div class="card"><h2>Cópia de segurança</h2><small style="color:var(--mut)">Baixa um arquivo com seus produtos, clientes, vendas e parcelas. Guarde em local seguro de tempos em tempos.</small><div style="margin-top:10px"><button class="btn sec" onclick="backup()">Baixar cópia dos meus dados</button></div></div>
  <div class="card"><b>Conta:</b> <small>entrada com o e-mail cadastrado.</small><div style="margin-top:10px"><button class="btn sec" onclick="sair()">Sair da conta</button></div></div>`;
}
async function salvarC(){
  const d={nome:$("#cn").value.trim()||"Minha Loja",whatsapp:$("#cz").value.trim()};
  if(await q(db.from("lojas").update(d).eq("id",uid))){await load();draw();alert("Salvo!")}
}
async function lerLogo(el){
  const f=el.files[0];el.value="";if(!f)return;
  const b=await cortar(f,true);if(!b)return;
  const u=await up(b,"png");if(!u)return;
  const velho=D.loja.logo_url;
  if(await q(db.from("lojas").update({logo_url:u}).eq("id",uid))){D.loja.logo_url=u;limpar([velho]);draw()}
}
async function rmLogo(){
  if(!D.loja.logo_url||!confirm("Remover a logo da loja?"))return;
  const velho=D.loja.logo_url;
  if(await q(db.from("lojas").update({logo_url:null}).eq("id",uid))){D.loja.logo_url=null;limpar([velho]);draw()}
}
async function setTema(campo,val){
  D.loja[campo]=val;draw();
  await q(db.from("lojas").update({[campo]:val}).eq("id",uid));
}
function backup(){
  const j=JSON.stringify({gerado_em:new Date().toISOString(),loja:D.loja,produtos:D.produtos,categorias:D.categorias,clientes:D.clientes,vendas:D.vendas,parcelas:D.parcelas,itens:D.itens,pagamentos:D.pagamentos},null,1);
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([j],{type:"application/json"}));a.download="backup-"+D.loja.slug+"-"+hoje()+".json";a.click();
}
function copiar(){const l=base()+"?loja="+D.loja.slug;try{navigator.clipboard.writeText(l);alert("Link copiado!")}catch(e){alert("Copie manualmente o link do campo.")}}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.closest&&e.target.closest("#auth")){e.preventDefault();const b=$("#abtn");if(b)b.click()}});
db.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY"){modo="nova";uid=null;draw()}});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{aplicarTema()});
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();instEvt=e;if(SLUG||(uid&&tab==="home"))draw()});
window.addEventListener("appinstalled",()=>{instEvt=null;draw()});
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
init();
</script>
</body>
